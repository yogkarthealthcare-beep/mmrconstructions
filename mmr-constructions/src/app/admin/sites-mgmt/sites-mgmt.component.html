<div class="mb-4"><h4 style="font-family:var(--ff-display);color:var(--txt-h);margin:0;">Plot & Site Management</h4>
<p style="font-size:13px;color:var(--txt-muted);margin:0;">Manage plots across all 5 sites</p></div>

<div class="row g-4 mb-4">
  <div class="col-sm-6 col-xl" *ngFor="let s of sites; let i = index">
    <div class="stat-card" style="cursor:pointer;" [style.border]="activeSite===i ? '2px solid var(--clr-primary)' : ''" (click)="activeSite=i">
      <div class="sc-icon" style="background:var(--clr-primary-bg);color:var(--clr-primary);"><i class="fas fa-map-marked-alt"></i></div>
      <div class="sc-val" style="font-size:1.4rem;">{{ s.total }}</div>
      <div class="sc-lbl" style="font-size:11px;">{{ s.name }}</div>
      <div class="d-flex gap-2 mt-2 flex-wrap">
        <span style="font-size:10px;background:#dcfce7;color:#16a34a;padding:2px 6px;border-radius:99px;">{{ s.vacant }} vacant</span>
        <span style="font-size:10px;background:#fef9c3;color:#ca8a04;padding:2px 6px;border-radius:99px;">{{ s.booked }} booked</span>
        <span style="font-size:10px;background:#fee2e2;color:#dc2626;padding:2px 6px;border-radius:99px;">{{ s.sold }} sold</span>
      </div>
    </div>
  </div>
</div>

<div class="panel-card">
  <div class="panel-card-title">
    {{ activeSiteData.name }} — Plot Map
    <div class="d-flex gap-3">
      <span style="font-size:11px;display:flex;align-items:center;gap:5px;"><span style="width:10px;height:10px;background:var(--st-vacant);border-radius:2px;display:inline-block;"></span>Vacant</span>
      <span style="font-size:11px;display:flex;align-items:center;gap:5px;"><span style="width:10px;height:10px;background:var(--st-process);border-radius:2px;display:inline-block;"></span>Booked</span>
      <span style="font-size:11px;display:flex;align-items:center;gap:5px;"><span style="width:10px;height:10px;background:var(--st-booked);border-radius:2px;display:inline-block;"></span>Sold</span>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(28px,1fr));gap:4px;">
    <div *ngFor="let p of plotGrid; let i = index"
      [title]="'Plot #' + (i+1) + ' — ' + p"
      style="width:28px;height:28px;border-radius:4px;cursor:pointer;transition:transform .1s;display:flex;align-items:center;justify-content:center;font-size:7px;color:#fff;font-weight:600;"
      [style.background]="p==='vacant' ? 'var(--st-vacant)' : p==='booked' ? 'var(--st-process)' : 'var(--st-booked)'">
      {{ i+1 }}
    </div>
  </div>
</div>
