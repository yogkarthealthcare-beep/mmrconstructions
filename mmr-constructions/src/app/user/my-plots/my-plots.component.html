<div class="mb-4"><h4 style="font-family:var(--ff-display);color:var(--txt-h);margin:0;">My Plots</h4>
<p style="font-size:13px;color:var(--txt-muted);margin:0;">All your registered plots and their status</p></div>

<div class="row g-4">
  <div class="col-lg-6" *ngFor="let p of plots">
    <div class="panel-card" style="padding:0;overflow:hidden;">
      <div style="position:relative;height:160px;">
        <img [src]="p.img" [alt]="p.site" style="width:100%;height:100%;object-fit:cover;"/>
        <div style="position:absolute;inset:0;background:linear-gradient(to bottom,transparent,rgba(0,0,0,.6));"></div>
        <div style="position:absolute;bottom:12px;left:16px;right:16px;display:flex;align-items:flex-end;justify-content:space-between;">
          <div>
            <div style="font-family:var(--ff-display);font-size:1.2rem;font-weight:700;color:#fff;">{{ p.id }}</div>
            <div style="font-size:12px;color:rgba(255,255,255,.8);">{{ p.site }}</div>
          </div>
          <span class="sbadge sbadge-green">{{ p.status }}</span>
        </div>
      </div>
      <div style="padding:20px;">
        <div class="row g-3 mb-3">
          <div class="col-6" *ngFor="let d of [['Plot Size',p.size],['Total Price',p.price],['Monthly EMI',p.emi],['Reg. Date',p.regDate]]">
            <div style="font-size:11px;color:var(--txt-muted);">{{ d[0] }}</div>
            <div style="font-size:14px;font-weight:600;color:var(--txt-h);">{{ d[1] }}</div>
          </div>
        </div>
        <div style="margin-bottom:14px;">
          <div class="d-flex justify-content-between mb-1">
            <span style="font-size:12px;color:var(--txt-muted);">Repayment Progress</span>
            <span style="font-size:12px;font-weight:600;color:var(--clr-primary);">{{ pct(p) }}%</span>
          </div>
          <div class="progress-bar-wrap"><div class="progress-bar-fill" [style.width]="pct(p) + '%'"></div></div>
          <div class="d-flex justify-content-between mt-1">
            <span style="font-size:11px;color:#16a34a;">{{ p.emiPaid }} EMIs paid</span>
            <span style="font-size:11px;color:var(--txt-muted);">{{ p.emiLeft }} remaining</span>
          </div>
        </div>
        <div style="background:var(--clr-gold-bg);border:1px solid var(--clr-gold);border-radius:var(--r-md);padding:10px 14px;display:flex;align-items:center;gap:8px;">
          <i class="fas fa-shield-alt" style="color:var(--clr-gold-dk);"></i>
          <span style="font-size:12px;color:var(--clr-gold-dk);">Buyback deadline: <strong>{{ p.buybackDeadline }}</strong></span>
        </div>
        <div class="d-flex gap-2 mt-3">
          <button class="btn btn-outline-green btn-sm flex-fill"><i class="fas fa-file-invoice me-1"></i>Agreement</button>
          <button class="btn btn-green btn-sm flex-fill"><i class="fas fa-calendar-check me-1"></i>Pay EMI</button>
        </div>
      </div>
    </div>
  </div>
</div>
