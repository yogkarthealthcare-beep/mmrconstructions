<div class="inv-page-shell">
  <!-- Page Header -->
  <div class="inv-page-header">
    <div class="inv-page-header-main">
      <div class="inv-page-icon-badge">
        <i class="fas fa-key"></i>
      </div>
      <div>
        <h1 class="inv-page-title">Change Password</h1>
        <p class="inv-page-subtitle">Update your account login password for enhanced account protection</p>
      </div>
    </div>
    <div class="inv-page-actions">
      <span class="inv-badge inv-badge-gold">
        <i class="fas fa-shield-alt"></i> 256-Bit Encrypted Security
      </span>
    </div>
  </div>

  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-9">
      <div class="inv-card">
        <div class="inv-card-header">
          <div class="inv-card-header-left">
            <div class="inv-card-header-icon primary">
              <i class="fas fa-lock"></i>
            </div>
            <div>
              <h2 class="inv-card-title">Update Password</h2>
              <p class="inv-card-desc">Choose a strong, unique password</p>
            </div>
          </div>
        </div>

        <div class="inv-card-body">
          <form (ngSubmit)="onSubmit()" novalidate>
            <!-- Current Password -->
            <div class="inv-form-group mb-3">
              <label class="inv-label">Current Password <span class="req">*</span></label>
              <div class="inv-input-group">
                <span class="inv-input-group-addon"><i class="fas fa-lock"></i></span>
                <input [type]="showCurrent ? 'text' : 'password'"
                       class="inv-input"
                       placeholder="Enter your current password"
                       [(ngModel)]="form.current_password"
                       name="current_password"
                       required />
                <button type="button" class="inv-btn inv-btn-outline inv-btn-sm" style="border-top-left-radius: 0; border-bottom-left-radius: 0; border-left: 0;" (click)="showCurrent = !showCurrent" tabindex="-1">
                  <i class="fas" [class.fa-eye]="!showCurrent" [class.fa-eye-slash]="showCurrent"></i>
                </button>
              </div>
            </div>

            <hr class="my-3 opacity-25">

            <!-- New Password -->
            <div class="inv-form-group mb-2">
              <label class="inv-label">New Password <span class="req">*</span></label>
              <div class="inv-input-group">
                <span class="inv-input-group-addon"><i class="fas fa-key"></i></span>
                <input [type]="showNew ? 'text' : 'password'"
                       class="inv-input"
                       placeholder="Enter new password (min. 8 characters)"
                       [(ngModel)]="form.new_password"
                       name="new_password"
                       required />
                <button type="button" class="inv-btn inv-btn-outline inv-btn-sm" style="border-top-left-radius: 0; border-bottom-left-radius: 0; border-left: 0;" (click)="showNew = !showNew" tabindex="-1">
                  <i class="fas" [class.fa-eye]="!showNew" [class.fa-eye-slash]="showNew"></i>
                </button>
              </div>

              <!-- Password Strength Indicator -->
              <div *ngIf="form.new_password" class="mt-2 p-2 rounded bg-light border">
                <div class="d-flex align-items-center justify-content-between mb-1">
                  <span class="text-muted" style="font-size: 11px;">Password Strength:</span>
                  <span class="fw-bold" style="font-size: 11px;" [style.color]="strengthColor">{{ strengthLabel }}</span>
                </div>
                <div class="progress" style="height: 4px;">
                  <div class="progress-bar" role="progressbar" [style.width]="(strength * 25) + '%'" [style.background-color]="strengthColor"></div>
                </div>
                <div class="d-flex flex-wrap gap-1.5 mt-2">
                  <span class="inv-badge" [class.inv-badge-approved]="form.new_password.length >= 8" [class.inv-badge-neutral]="form.new_password.length < 8" style="font-size: 10px;">
                    <i class="fas" [class.fa-check]="form.new_password.length >= 8" [class.fa-times]="form.new_password.length < 8"></i> 8+ chars
                  </span>
                  <span class="inv-badge" [class.inv-badge-approved]="hasUppercase()" [class.inv-badge-neutral]="!hasUppercase()" style="font-size: 10px;">
                    <i class="fas" [class.fa-check]="hasUppercase()" [class.fa-times]="!hasUppercase()"></i> Uppercase
                  </span>
                  <span class="inv-badge" [class.inv-badge-approved]="hasNumber()" [class.inv-badge-neutral]="!hasNumber()" style="font-size: 10px;">
                    <i class="fas" [class.fa-check]="hasNumber()" [class.fa-times]="!hasNumber()"></i> Number
                  </span>
                  <span class="inv-badge" [class.inv-badge-approved]="hasSpecialChar()" [class.inv-badge-neutral]="!hasSpecialChar()" style="font-size: 10px;">
                    <i class="fas" [class.fa-check]="hasSpecialChar()" [class.fa-times]="!hasSpecialChar()"></i> Symbol
                  </span>
                </div>
              </div>
            </div>

            <!-- Confirm New Password -->
            <div class="inv-form-group mb-3">
              <label class="inv-label">Confirm New Password <span class="req">*</span></label>
              <div class="inv-input-group">
                <span class="inv-input-group-addon"><i class="fas fa-check-double"></i></span>
                <input [type]="showConfirm ? 'text' : 'password'"
                       class="inv-input"
                       placeholder="Re-enter your new password"
                       [(ngModel)]="form.confirm_password"
                       name="confirm_password"
                       required />
                <button type="button" class="inv-btn inv-btn-outline inv-btn-sm" style="border-top-left-radius: 0; border-bottom-left-radius: 0; border-left: 0;" (click)="showConfirm = !showConfirm" tabindex="-1">
                  <i class="fas" [class.fa-eye]="!showConfirm" [class.fa-eye-slash]="showConfirm"></i>
                </button>
              </div>
              <div *ngIf="form.confirm_password && form.new_password !== form.confirm_password" class="text-danger small mt-1" style="font-size: 11px;">
                <i class="fas fa-exclamation-circle me-1"></i> Passwords do not match
              </div>
            </div>

            <!-- Submit Button -->
            <div class="mt-3 pt-2 border-top">
              <button type="submit"
                      class="inv-btn inv-btn-primary w-100 py-2"
                      [disabled]="loading || !form.current_password || !form.new_password || form.new_password !== form.confirm_password">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-1.5"></span>
                <i *ngIf="!loading" class="fas fa-save me-1.5"></i>
                {{ loading ? 'Updating Password...' : 'Update Password' }}
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
