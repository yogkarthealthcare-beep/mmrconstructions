<div class="change-password-page">
  <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
    <div>
      <h4 class="fw-bold text-dark mb-1">Change Password</h4>
      <p class="text-muted mb-0">Update your account login password for enhanced security</p>
    </div>
  </div>

  <div class="row g-4 justify-content-center">
    <div class="col-lg-7 col-md-10">
      <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
        <form (ngSubmit)="onSubmit()" novalidate>

          <!-- Current Password -->
          <div class="mb-4">
            <label class="form-label fw-semibold text-secondary small text-uppercase">Current Password <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="fas fa-lock"></i></span>
              <input [type]="showCurrent ? 'text' : 'password'"
                     class="form-control border-start-0 border-end-0 bg-light"
                     placeholder="Enter your current password"
                     [(ngModel)]="form.current_password"
                     name="current_password"
                     required />
              <button type="button" class="btn btn-light border border-start-0 text-muted" (click)="showCurrent = !showCurrent" tabindex="-1">
                <i class="fas" [class.fa-eye]="!showCurrent" [class.fa-eye-slash]="showCurrent"></i>
              </button>
            </div>
          </div>

          <hr class="my-4 text-muted opacity-25">

          <!-- New Password -->
          <div class="mb-3">
            <label class="form-label fw-semibold text-secondary small text-uppercase">New Password <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="fas fa-key"></i></span>
              <input [type]="showNew ? 'text' : 'password'"
                     class="form-control border-start-0 border-end-0 bg-light"
                     placeholder="Enter new password (min. 8 characters)"
                     [(ngModel)]="form.new_password"
                     name="new_password"
                     required />
              <button type="button" class="btn btn-light border border-start-0 text-muted" (click)="showNew = !showNew" tabindex="-1">
                <i class="fas" [class.fa-eye]="!showNew" [class.fa-eye-slash]="showNew"></i>
              </button>
            </div>

            <!-- Password Strength Indicator -->
            <div *ngIf="form.new_password" class="mt-2">
              <div class="d-flex align-items-center justify-content-between mb-1">
                <small class="text-muted">Password Strength:</small>
                <small class="fw-bold" [style.color]="strengthColor">{{ strengthLabel }}</small>
              </div>
              <div class="progress" style="height: 5px;">
                <div class="progress-bar" role="progressbar" [style.width]="(strength * 25) + '%'" [style.background-color]="strengthColor"></div>
              </div>
              <div class="d-flex flex-wrap gap-2 mt-2">
                <span class="badge bg-light text-secondary border" [class.border-success]="form.new_password.length >= 8" [class.text-success]="form.new_password.length >= 8">
                  <i class="fas" [class.fa-check]="form.new_password.length >= 8" [class.fa-times]="form.new_password.length < 8"></i> 8+ chars
                </span>
                <span class="badge bg-light text-secondary border" [class.border-success]="hasUppercase()" [class.text-success]="hasUppercase()">
                  <i class="fas" [class.fa-check]="hasUppercase()" [class.fa-times]="!hasUppercase()"></i> Uppercase
                </span>
                <span class="badge bg-light text-secondary border" [class.border-success]="hasNumber()" [class.text-success]="hasNumber()">
                  <i class="fas" [class.fa-check]="hasNumber()" [class.fa-times]="!hasNumber()"></i> Number
                </span>
                <span class="badge bg-light text-secondary border" [class.border-success]="hasSpecialChar()" [class.text-success]="hasSpecialChar()">
                  <i class="fas" [class.fa-check]="hasSpecialChar()" [class.fa-times]="!hasSpecialChar()"></i> Symbol
                </span>
              </div>
            </div>
          </div>

          <!-- Confirm New Password -->
          <div class="mb-4">
            <label class="form-label fw-semibold text-secondary small text-uppercase">Confirm New Password <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="fas fa-check-double"></i></span>
              <input [type]="showConfirm ? 'text' : 'password'"
                     class="form-control border-start-0 border-end-0 bg-light"
                     placeholder="Re-enter your new password"
                     [(ngModel)]="form.confirm_password"
                     name="confirm_password"
                     required />
              <button type="button" class="btn btn-light border border-start-0 text-muted" (click)="showConfirm = !showConfirm" tabindex="-1">
                <i class="fas" [class.fa-eye]="!showConfirm" [class.fa-eye-slash]="showConfirm"></i>
              </button>
            </div>
            <div *ngIf="form.confirm_password && form.new_password !== form.confirm_password" class="text-danger small mt-1">
              <i class="fas fa-exclamation-circle me-1"></i> Passwords do not match
            </div>
          </div>

          <!-- Submit Button -->
          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-success py-2.5 fw-bold shadow-sm" [disabled]="loading || !form.current_password || !form.new_password || form.new_password !== form.confirm_password" style="background-color: #1a5c3a; border-color: #1a5c3a;">
              <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
              {{ loading ? 'Updating Password...' : 'Update Password' }}
            </button>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>
