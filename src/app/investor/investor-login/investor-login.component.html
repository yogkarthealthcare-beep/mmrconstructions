<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header text-center mb-4">
      <div class="auth-logo mx-auto mb-2">
        <i class="fas fa-hand-holding-usd text-success"></i>
      </div>
      <h3 class="fw-bold text-dark">Investor Login</h3>
      <p class="text-muted fs-6">Access your MMR Construction Investor Dashboard</p>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger d-flex align-items-center gap-2 mb-3">
      <i class="fas fa-exclamation-circle"></i>
      <span>{{ errorMessage }}</span>
    </div>

    <div *ngIf="successMessage" class="alert alert-success d-flex align-items-center gap-2 mb-3">
      <i class="fas fa-check-circle"></i>
      <span>{{ successMessage }}</span>
    </div>

    <form (ngSubmit)="login()">
      <div class="mb-3">
        <label class="form-label fw-semibold">Email / Mobile Number</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-envelope"></i></span>
          <input type="text"
                 class="form-control"
                 [(ngModel)]="email"
                 name="email"
                 placeholder="enter email or mobile number"
                 required />
        </div>
      </div>

      <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label class="form-label fw-semibold mb-0">Password</label>
          <a routerLink="/investor/forgot-password" class="text-success small fw-semibold text-decoration-none">Forgot Password?</a>
        </div>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-lock"></i></span>
          <input [type]="showPassword ? 'text' : 'password'"
                 class="form-control"
                 [(ngModel)]="password"
                 name="password"
                 placeholder="Enter password"
                 required />
          <button type="button" class="btn btn-outline-secondary" (click)="showPassword = !showPassword">
            <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
          </button>
        </div>
      </div>

      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="investorRemember" [(ngModel)]="rememberMe" name="rememberMe">
        <label class="form-check-label fw-semibold" for="investorRemember">Remember Me</label>
      </div>

      <button type="submit" class="btn btn-success w-100 py-2.5 fw-bold shadow-sm rounded-3 mt-2" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        {{ loading ? 'Signing in...' : 'Login to Investor Portal' }}
      </button>

      <div class="text-center mt-4 pt-2 border-top">
        <p class="text-muted mb-0">Not an investor yet?
          <a routerLink="/investor/signup" class="text-success fw-bold text-decoration-none ms-1">Create Account</a>
        </p>
      </div>
    </form>
  </div>
</div>
