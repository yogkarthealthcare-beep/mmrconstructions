<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header text-center mb-3">
      <div class="auth-logo mx-auto mb-2">
        <i class="fas fa-hand-holding-usd"></i>
      </div>
      <h2 class="fw-bold text-dark fs-4 mb-1">Investor Portal</h2>
      <p class="text-muted small mb-0">Sign in to your MMR Constructions investor portfolio</p>
    </div>

    <div *ngIf="errorMessage" class="inv-alert inv-alert-danger mb-3">
      <i class="fas fa-exclamation-circle mt-0.5"></i>
      <div>{{ errorMessage }}</div>
    </div>

    <div *ngIf="successMessage" class="inv-alert inv-alert-success mb-3">
      <i class="fas fa-check-circle mt-0.5"></i>
      <div>{{ successMessage }}</div>
    </div>

    <form (ngSubmit)="login()">
      <div class="inv-form-group mb-2.5">
        <label class="inv-label" for="loginEmail">Email / Mobile Number <span class="req">*</span></label>
        <div class="inv-input-group">
          <span class="inv-input-group-addon"><i class="fas fa-envelope"></i></span>
          <input id="loginEmail"
                 type="text"
                 class="inv-input"
                 [(ngModel)]="email"
                 name="email"
                 placeholder="Enter registered email or mobile"
                 required />
        </div>
      </div>

      <div class="inv-form-group mb-2.5">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label class="inv-label mb-0" for="loginPass">Password <span class="req">*</span></label>
          <a routerLink="/investor/forgot-password" class="text-success small fw-semibold text-decoration-none" style="font-size: 11.5px;">Forgot Password?</a>
        </div>
        <div class="inv-input-group">
          <span class="inv-input-group-addon"><i class="fas fa-lock"></i></span>
          <input id="loginPass"
                 [type]="showPassword ? 'text' : 'password'"
                 class="inv-input"
                 [(ngModel)]="password"
                 name="password"
                 placeholder="Enter your password"
                 required />
          <button type="button" class="inv-btn inv-btn-outline inv-btn-sm" style="border-top-left-radius: 0; border-bottom-left-radius: 0; border-left: 0;" (click)="showPassword = !showPassword">
            <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
          </button>
        </div>
      </div>

      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="investorRemember" [(ngModel)]="rememberMe" name="rememberMe" style="accent-color: #0f3d27;">
        <label class="form-check-label text-muted small fw-semibold" for="investorRemember">Remember Me</label>
      </div>

      <button type="submit" class="inv-btn inv-btn-primary w-100 py-2 fs-6 shadow-sm" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-1.5"></span>
        <i *ngIf="!loading" class="fas fa-sign-in-alt me-1.5"></i>
        {{ loading ? 'Signing in...' : 'Sign In to Investor Account' }}
      </button>

      <div class="text-center mt-3 pt-3 border-top">
        <p class="text-muted small mb-0">New to MMR Constructions?
          <a routerLink="/investor/signup" class="text-success fw-bold text-decoration-none ms-1">Create Investor Account</a>
        </p>
      </div>
    </form>
  </div>
</div>
