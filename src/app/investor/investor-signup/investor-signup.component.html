<div class="auth-page py-5">
  <div class="auth-card signup-card">
    <div class="auth-header text-center mb-4">
      <div class="auth-logo mx-auto mb-2">
        <i class="fas fa-user-plus text-success"></i>
      </div>
      <h3 class="fw-bold text-dark">Investor Sign Up</h3>
      <p class="text-muted fs-6">Register as an Investor with MMR Construction</p>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger d-flex align-items-center gap-2 mb-3">
      <i class="fas fa-exclamation-circle"></i>
      <span>{{ errorMessage }}</span>
    </div>

    <div *ngIf="successMessage" class="alert alert-success d-flex align-items-center gap-2 mb-3">
      <i class="fas fa-check-circle"></i>
      <span>{{ successMessage }}</span>
    </div>

    <form (ngSubmit)="signup()">
      <!-- Step 1: Personal Info -->
      <h6 class="text-success fw-bold border-bottom pb-2 mb-3">
        <i class="fas fa-user me-2"></i>Personal Details
      </h6>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Full Name *</label>
          <input type="text" class="form-control" [(ngModel)]="form.full_name" name="full_name" placeholder="Full name" required />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Mobile Number *</label>
          <input type="tel" class="form-control" [(ngModel)]="form.mobile_number" name="mobile_number" placeholder="Mobile number" required />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Email Address *</label>
          <input type="email" class="form-control" [(ngModel)]="form.email" name="email" placeholder="Email address" required />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Nominee Name (Optional)</label>
          <input type="text" class="form-control" [(ngModel)]="form.nominee_name" name="nominee_name" placeholder="Nominee name" />
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Password *</label>
          <input type="password" class="form-control" [(ngModel)]="form.password" name="password" placeholder="Password" required />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Confirm Password *</label>
          <input type="password" class="form-control" [(ngModel)]="form.confirm_password" name="confirm_password" placeholder="Confirm password" required />
        </div>
      </div>

      <!-- Step 2: Identification & Address -->
      <h6 class="text-success fw-bold border-bottom pb-2 my-3">
        <i class="fas fa-id-card me-2"></i>Address & Identification
      </h6>

      <div class="mb-3">
        <label class="form-label fw-semibold">Address</label>
        <textarea class="form-control" rows="2" [(ngModel)]="form.address" name="address" placeholder="Full address"></textarea>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <label class="form-label fw-semibold">City</label>
          <input type="text" class="form-control" [(ngModel)]="form.city" name="city" placeholder="City" />
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">State</label>
          <input type="text" class="form-control" [(ngModel)]="form.state" name="state" placeholder="State" />
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">Pincode</label>
          <input type="text" class="form-control" [(ngModel)]="form.pincode" name="pincode" placeholder="Pincode" />
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">PAN Number</label>
          <input type="text" class="form-control text-uppercase" [(ngModel)]="form.pan_number" name="pan_number" placeholder="PAN Number" />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Aadhaar Number (Optional)</label>
          <input type="text" class="form-control" [(ngModel)]="form.aadhaar_number" name="aadhaar_number" placeholder="12-digit Aadhaar" />
        </div>
      </div>

      <!-- Step 3: Bank Details -->
      <h6 class="text-success fw-bold border-bottom pb-2 my-3">
        <i class="fas fa-university me-2"></i>Bank Details
      </h6>

      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <label class="form-label fw-semibold">Bank Name</label>
          <input type="text" class="form-control" [(ngModel)]="form.bank_name" name="bank_name" placeholder="Bank name" />
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">Account Number</label>
          <input type="text" class="form-control" [(ngModel)]="form.account_number" name="account_number" placeholder="Account number" />
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">IFSC Code</label>
          <input type="text" class="form-control text-uppercase" [(ngModel)]="form.ifsc_code" name="ifsc_code" placeholder="IFSC Code" />
        </div>
      </div>

      <button type="submit" class="btn btn-success w-100 py-2.5 fw-bold shadow-sm rounded-3 mt-3" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        {{ loading ? 'Creating Account...' : 'Register as Investor' }}
      </button>

      <div class="text-center mt-4 pt-2 border-top">
        <p class="text-muted mb-0">Already have an investor account?
          <a routerLink="/investor/login" class="text-success fw-bold text-decoration-none ms-1">Login Here</a>
        </p>
      </div>
    </form>
  </div>
</div>
