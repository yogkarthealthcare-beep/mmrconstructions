<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header text-center mb-3">
      <div class="auth-logo mx-auto mb-2">
        <i class="fas fa-key"></i>
      </div>
      <h2 class="fw-bold text-dark fs-4 mb-1">Reset Password</h2>
      <p class="text-muted small mb-0">Investor Account Recovery</p>
    </div>

    <div *ngIf="errorMessage" class="inv-alert inv-alert-danger mb-3">
      <i class="fas fa-exclamation-circle mt-0.5"></i>
      <div>{{ errorMessage }}</div>
    </div>

    <div *ngIf="successMessage" class="inv-alert inv-alert-success mb-3">
      <i class="fas fa-check-circle mt-0.5"></i>
      <div>{{ successMessage }}</div>
    </div>

    <!-- Step 1: Request OTP -->
    <form *ngIf="step === 1" (ngSubmit)="requestOtp()">
      <div class="inv-form-group mb-3">
        <label class="inv-label" for="resetEmail">Registered Email Address <span class="req">*</span></label>
        <div class="inv-input-group">
          <span class="inv-input-group-addon"><i class="fas fa-envelope"></i></span>
          <input id="resetEmail"
                 type="email"
                 class="inv-input"
                 [(ngModel)]="email"
                 name="email"
                 placeholder="Enter registered email"
                 required />
        </div>
      </div>

      <button type="submit" class="inv-btn inv-btn-primary w-100 py-2 fs-6 shadow-sm" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-1.5"></span>
        <i *ngIf="!loading" class="fas fa-paper-plane me-1.5"></i>
        {{ loading ? 'Sending OTP...' : 'Send Reset OTP' }}
      </button>

      <div class="text-center mt-3 pt-3 border-top">
        <a routerLink="/investor/login" class="text-success fw-bold text-decoration-none small">
          <i class="fas fa-arrow-left me-1"></i> Back to Login
        </a>
      </div>
    </form>

    <!-- Step 2: Enter OTP & New Password -->
    <form *ngIf="step === 2" (ngSubmit)="resetPassword()">
      <div class="inv-form-group mb-2.5">
        <label class="inv-label" for="resetOtp">OTP Code <span class="req">*</span></label>
        <input id="resetOtp"
               type="text"
               class="inv-input font-monospace text-center"
               style="letter-spacing: 4px; font-size: 1.1rem; font-weight: 700;"
               [(ngModel)]="otp"
               name="otp"
               placeholder="6-digit OTP"
               required />
      </div>

      <div class="inv-form-group mb-2.5">
        <label class="inv-label" for="resetNewPass">New Password <span class="req">*</span></label>
        <input id="resetNewPass"
               type="password"
               class="inv-input"
               [(ngModel)]="new_password"
               name="new_password"
               placeholder="Enter new password (min. 8 chars)"
               required />
      </div>

      <div class="inv-form-group mb-3">
        <label class="inv-label" for="resetConfPass">Confirm New Password <span class="req">*</span></label>
        <input id="resetConfPass"
               type="password"
               class="inv-input"
               [(ngModel)]="confirm_password"
               name="confirm_password"
               placeholder="Re-enter new password"
               required />
      </div>

      <button type="submit" class="inv-btn inv-btn-primary w-100 py-2 fs-6 shadow-sm" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-1.5"></span>
        <i *ngIf="!loading" class="fas fa-check-circle me-1.5"></i>
        {{ loading ? 'Resetting Password...' : 'Reset Password' }}
      </button>

      <div class="text-center mt-3 d-flex align-items-center justify-content-between">
        <button type="button" class="btn btn-link text-muted text-decoration-none p-0 small" (click)="step = 1">
          <i class="fas fa-redo-alt me-1"></i> Resend OTP
        </button>
        <a routerLink="/investor/login" class="text-success fw-bold text-decoration-none small">
          Back to Login
        </a>
      </div>
    </form>
  </div>
</div>
