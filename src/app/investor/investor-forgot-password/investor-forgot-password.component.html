<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header text-center mb-4">
      <div class="auth-logo mx-auto mb-2">
        <i class="fas fa-key text-success"></i>
      </div>
      <h3 class="fw-bold text-dark">Reset Password</h3>
      <p class="text-muted fs-6">Investor Account Recovery</p>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger d-flex align-items-center gap-2 mb-3">
      <i class="fas fa-exclamation-circle"></i>
      <span>{{ errorMessage }}</span>
    </div>

    <div *ngIf="successMessage" class="alert alert-success d-flex align-items-center gap-2 mb-3">
      <i class="fas fa-check-circle"></i>
      <span>{{ successMessage }}</span>
    </div>

    <!-- Step 1: Request OTP -->
    <form *ngIf="step === 1" (ngSubmit)="requestOtp()">
      <div class="mb-3">
        <label class="form-label fw-semibold">Registered Email Address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-envelope"></i></span>
          <input type="email" class="form-control" [(ngModel)]="email" name="email" placeholder="Enter email" required />
        </div>
      </div>

      <button type="submit" class="btn btn-success w-100 py-2.5 fw-bold shadow-sm rounded-3 mt-2" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        {{ loading ? 'Sending OTP...' : 'Send Reset OTP' }}
      </button>

      <div class="text-center mt-4 pt-2 border-top">
        <a routerLink="/investor/login" class="text-success fw-bold text-decoration-none">
          <i class="fas fa-arrow-left me-1"></i> Back to Login
        </a>
      </div>
    </form>

    <!-- Step 2: Enter OTP & New Password -->
    <form *ngIf="step === 2" (ngSubmit)="resetPassword()">
      <div class="mb-3">
        <label class="form-label fw-semibold">OTP Code</label>
        <input type="text" class="form-control" [(ngModel)]="otp" name="otp" placeholder="Enter 6-digit OTP" required />
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">New Password</label>
        <input type="password" class="form-control" [(ngModel)]="new_password" name="new_password" placeholder="Enter new password" required />
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Confirm New Password</label>
        <input type="password" class="form-control" [(ngModel)]="confirm_password" name="confirm_password" placeholder="Confirm new password" required />
      </div>

      <button type="submit" class="btn btn-success w-100 py-2.5 fw-bold shadow-sm rounded-3 mt-2" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        {{ loading ? 'Resetting Password...' : 'Reset Password' }}
      </button>

      <div class="text-center mt-3">
        <button type="button" class="btn btn-link text-muted text-decoration-none small" (click)="step = 1">Resend OTP</button>
      </div>
    </form>
  </div>
</div>
