<section id="buyback" class="sec-py buyback-section">
  <div class="mmr-container" style="position:relative;z-index:1;">
    <div class="text-center mb-5">
      <div class="sec-label" style="justify-content:center;color:var(--clr-gold-lt);">Risk-Free Investment</div>
      <h2 class="sec-title" style="color:#fff;">Our <span style="color:var(--clr-gold-lt);">Buyback Guarantee</span></h2>
      <p style="color:rgba(255,255,255,.6);max-width:520px;margin:0 auto;font-size:15px;">India की उन चुनिंदा real estate companies में से एक जो genuine buyback guarantee देती है।</p>
    </div>
    <div class="row g-4">
      <div class="col-sm-6 col-lg-3" *ngFor="let card of cards">
        <div class="bb-card">
          <div class="bb-icon"><i [class]="card.icon"></i></div>
          <h5>{{ card.title }}</h5>
          <p>{{ card.desc }}</p>
        </div>
      </div>
    </div>
    <div class="text-center mt-5">
      <a href="#" class="btn btn-gold btn-lg"><i class="fas fa-arrow-right me-2"></i>Read Full Policy</a>
    </div>
  </div>
</section>
