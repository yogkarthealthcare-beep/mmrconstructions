<section id="buyback" class="sec-py buyback-section">
  <div class="mmr-container" style="position:relative;z-index:1;">
    <div class="text-center mb-5">
      <div class="sec-label" style="justify-content:center;color:var(--clr-gold-lt);">A Decade of Excellence</div>
      <h2 class="sec-title" style="color:#fff;">10 Years of <span style="color:var(--clr-gold-lt);">Trust & Reliability</span></h2>
      <p style="color:rgba(255,255,255,.6);max-width:540px;margin:0 auto;font-size:15px;">10+ वर्षों का अटूट विश्वास, निष्पक्ष पारदर्शिता और सैकड़ों संतुष्ट परिवारों का सपना साकार करने का संकल्प।</p>
    </div>
    <div class="row g-4">
      <div class="col-sm-6 col-lg-3" *ngFor="let card of cards">
        <div class="bb-card">
          <div class="bb-icon"><i [class]="card.icon"></i></div>
          <h5>{{ card.title }}</h5>
          <p>{{ card.desc }}</p>
        </div>
      </div>
    </div>
    <div class="text-center mt-5">
      <button class="btn btn-gold btn-lg" (click)="scrollTo('contact')"><i class="fas fa-handshake me-2"></i>Contact Our Experts</button>
    </div>
  </div>
</section>
