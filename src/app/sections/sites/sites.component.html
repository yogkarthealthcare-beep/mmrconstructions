<section id="sites" class="premium-sites-section">
  <div class="mmr-container">
    <!-- Section Header -->
    <div class="section-header-wrap mb-5">
      <div class="sec-label">Our Locations</div>
      <h2 class="sec-title">5 Premium Sites<br/><span>Across 3 Cities</span></h2>
      <div class="sec-line"></div>
      <p class="sec-desc">Kanpur, Unnao और Lucknow के prime locations पर affordable plots। हर site highway, airport और colleges के नजदीक।</p>
    </div>

    <!-- Fixed Premium Showcase Grid -->
    <div class="showcase-grid-layout" *ngIf="sites.length > 0">
      <!-- Large Featured Site (Left) -->
      <div class="featured-col" *ngIf="featuredSite">
        <div class="showcase-card featured-card">
          <div class="card-media-wrap">
            <img [src]="featuredSite.site_image" [alt]="featuredSite.site_name" loading="lazy" (error)="onImageError($event)"/>
            <div class="card-gradient-overlay"></div>
          </div>

          <div class="card-top-tag">
            <span class="featured-tag-pill">
              <i class="fas fa-star me-1.5 text-gold"></i> Featured Project
            </span>
          </div>

          <div class="card-caption-wrap">
            <h3 class="card-site-name featured-name">{{ featuredSite.site_name }}</h3>
            <div class="card-site-address featured-address">
              <i class="fas fa-map-marker-alt text-gold-icon" aria-hidden="true"></i>
              <span>{{ featuredSite.site_address }}</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 2 x 2 Smaller Sites Grid (Right) -->
      <div class="grid-col" *ngIf="gridSites.length > 0">
        <div class="sub-cards-grid">
          <div class="showcase-card sub-card" *ngFor="let site of gridSites; trackBy: trackById">
            <div class="card-media-wrap">
              <img [src]="site.site_image" [alt]="site.site_name" loading="lazy" (error)="onImageError($event)"/>
              <div class="card-gradient-overlay"></div>
            </div>

            <div class="card-caption-wrap">
              <h4 class="card-site-name sub-name">{{ site.site_name }}</h4>
              <div class="card-site-address sub-address">
                <i class="fas fa-map-marker-alt text-gold-icon" aria-hidden="true"></i>
                <span>{{ site.site_address }}</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
