<section class="investors-section sec-py"><div class="mmr-container"><div class="text-center mb-5"><div class="sec-label" style="justify-content:center">People Who Trust Us</div><h2 class="sec-title">Our Investors</h2></div><div class="investor-loading" *ngIf="loading"><i class="fas fa-spinner fa-spin"></i></div><div class="investor-grid" *ngIf="!loading && investors.length"><article *ngFor="let investor of investors"><div class="portrait"><img [src]="getImageUrl(investor.profile_image_url)" [alt]="investor.name+' — MMR Constructions investor'" width="180" height="180" loading="lazy" (error)="imageError($event)"></div><h3>{{investor.name}}</h3></article></div><div class="investor-empty" *ngIf="!loading && !investors.length">Investor profiles will be available soon.</div></div></section>
