<section id="earn" class="sec-py earn-section">
  <div class="mmr-container">
    <div class="row g-5 align-items-center">
      <div class="col-lg-5">
        <div class="sec-label">Associate Program</div>
        <h2 class="sec-title">Earn <span>Commission</span><br/>For 12 Years</h2>
        <div class="sec-line"></div>
        <p class="sec-desc mb-5">Plot बेचें, commission पाएं — और वो भी 12 साल तक हर महीने।</p>
        <div class="timeline">
          <div class="tl-item" *ngFor="let t of timeline">
            <div class="tl-dot"></div>
            <div class="tl-box">
              <div class="tl-label">{{ t.label }}</div>
              <div class="tl-value">{{ t.value }}</div>
              <div class="tl-desc">{{ t.desc }}</div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-lg-7">
        <div style="background:#fff;border-radius:var(--r-xl);padding:36px 40px;border:1px solid var(--bdr);box-shadow:var(--sh-lg);">
          <h4 style="font-family:var(--ff-display);color:var(--txt-h);margin-bottom:28px;">How It Works</h4>
          <div style="display:flex;flex-direction:column;gap:22px;">
            <div style="display:flex;gap:16px;align-items:flex-start;" *ngFor="let s of steps">
              <div [style]="'width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:' + (s.gold ? '16px' : '13px') + ';font-weight:700;color:' + (s.gold ? 'initial' : '#fff') + ';background:' + (s.gold ? 'var(--grad-gold)' : 'var(--grad-green)')">{{ s.num }}</div>
              <div><h6 style="color:var(--txt-h);margin-bottom:4px;">{{ s.title }}</h6><p style="font-size:13px;color:var(--txt-muted);margin:0;">{{ s.desc }}</p></div>
            </div>
          </div>
          <div style="margin-top:28px;">
            <a routerLink="/register" class="btn btn-green btn-lg w-100"><i class="fas fa-user-tie me-2"></i>Become an Associate — Free</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
