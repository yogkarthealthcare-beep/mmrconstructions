<section id="contact" class="sec-py contact-section">
  <div class="mmr-container">
    <div class="row g-5">
      <div class="col-lg-5">
        <div class="sec-label">Get In Touch</div>
        <h2 class="sec-title">Contact <span>Us</span></h2>
        <div class="sec-line"></div>
        <p class="sec-desc mb-5">कोई भी सवाल, site visit, या enquiry के लिए हमसे contact करें।</p>
        <div class="c-info-item">
          <div class="c-info-icon"><i class="fas fa-phone-alt"></i></div>
          <div><div style="font-size:12px;color:var(--txt-muted);margin-bottom:2px;">Phone</div><a href="tel:+917071951011" style="font-size:15px;font-weight:600;color:var(--txt-h);">+91 70719 51011</a></div>
        </div>
        <div class="c-info-item">
          <div class="c-info-icon"><i class="fas fa-map-marker-alt"></i></div>
          <div><div style="font-size:12px;color:var(--txt-muted);margin-bottom:2px;">Office</div><span style="font-size:14px;color:var(--txt-body);">Neel Kanth Market, Ramadevi, Kanpur</span></div>
        </div>
        <div class="c-info-item">
          <div class="c-info-icon"><i class="fas fa-id-card"></i></div>
          <div><div style="font-size:12px;color:var(--txt-muted);margin-bottom:2px;">Corporate ID</div><span style="font-size:14px;color:var(--txt-body);">CIN: U68200UP2025PTC229203 | Est. 2019</span></div>
        </div>
      </div>
      <div class="col-lg-7">
        <div class="contact-box">
          <h5 style="font-family:var(--ff-display);color:var(--txt-h);margin-bottom:24px;">Send Enquiry</h5>
          <div *ngIf="submitted" style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:var(--r-md);padding:12px 16px;margin-bottom:20px;">
            <i class="fas fa-check-circle" style="color:#16a34a;margin-right:8px;"></i><span style="font-size:14px;">Thank you! We'll contact you shortly.</span>
          </div>
          <form (ngSubmit)="onSubmit()" #contactForm="ngForm">
            <div class="row g-3">
              <div class="col-sm-6">
                <label class="f-label">Your Name *</label>
                <input type="text" class="f-input" placeholder="Full Name" [(ngModel)]="form.name" name="name" required/>
              </div>
              <div class="col-sm-6">
                <label class="f-label">Mobile Number *</label>
                <input type="tel" class="f-input" placeholder="10-digit mobile" [(ngModel)]="form.mobile" name="mobile" required/>
              </div>
              <div class="col-12">
                <label class="f-label">Interested In</label>
                <select class="f-select" [(ngModel)]="form.interest" name="interest">
                  <option>Plot Booking — 100 Gaj</option>
                  <option>Plot Booking — 50 Gaj</option>
                  <option>Associate / Commission Program</option>
                  <option>Site Visit Request</option>
                  <option>General Enquiry</option>
                </select>
              </div>
              <div class="col-12">
                <label class="f-label">Message</label>
                <textarea class="f-input" rows="3" placeholder="Your message..." [(ngModel)]="form.message" name="message"></textarea>
              </div>
              <div class="col-12 mt-1">
                <button type="submit" class="btn btn-green btn-lg w-100"><i class="fas fa-paper-plane me-2"></i>Send Enquiry</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
