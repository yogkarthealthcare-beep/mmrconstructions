<div class="d-flex align-items-start justify-content-between mb-4 flex-wrap gap-3">
  <div class="pg-header" style="margin-bottom:0;">
    <h4>Change Password</h4>
    <p>Update your user account password</p>
  </div>
</div>

<div class="row justify-content-center">
  <div class="col-lg-6 col-md-8">
    <div class="panel-card">
      <div *ngIf="success" class="panel-alert panel-alert-success mb-4">
        <i class="fas fa-check-circle"></i> {{ success }}
      </div>
      <div *ngIf="error" class="panel-alert panel-alert-error mb-4">
        <i class="fas fa-exclamation-circle"></i> {{ error }}
      </div>

      <div class="mb-4">
        <label class="f-label">Current Password *</label>
        <div style="position:relative;">
          <input [type]="showCurrent ? 'text' : 'password'" class="f-input"
            placeholder="Enter current password"
            [(ngModel)]="form.current_password" name="current_password"
            autocomplete="current-password" style="padding-right:44px;"/>
          <button type="button" class="pass-toggle" (click)="showCurrent=!showCurrent">
            <i [class]="showCurrent ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
          </button>
        </div>
      </div>

      <hr style="border-color:var(--bdr);margin:20px 0;"/>

      <div class="mb-3">
        <label class="f-label">New Password *</label>
        <div style="position:relative;">
          <input [type]="showNew ? 'text' : 'password'" class="f-input"
            placeholder="Minimum 8 characters"
            [(ngModel)]="form.new_password" name="new_password"
            autocomplete="new-password" style="padding-right:44px;"/>
          <button type="button" class="pass-toggle" (click)="showNew=!showNew">
            <i [class]="showNew ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
          </button>
        </div>

        <div *ngIf="form.new_password" class="mt-2">
          <div style="display:flex;gap:4px;margin-bottom:4px;">
            <div *ngFor="let i of [1,2,3,4]"
              style="height:4px;flex:1;border-radius:4px;transition:background .3s;"
              [style.background]="i <= strength ? strengthColor : '#e5e7eb'"></div>
          </div>
          <span style="font-size:11px;font-weight:600;" [style.color]="strengthColor">
            {{ strengthLabel }}
          </span>
        </div>

        <div class="mt-2 d-flex flex-wrap gap-2">
          <span class="req-badge" [class.met]="form.new_password.length >= 8">
            <i class="fas fa-check-circle me-1"></i>8+ characters
          </span>
          <span class="req-badge" [class.met]="hasUppercase()">
            <i class="fas fa-check-circle me-1"></i>Uppercase
          </span>
          <span class="req-badge" [class.met]="hasNumber()">
            <i class="fas fa-check-circle me-1"></i>Number
          </span>
          <span class="req-badge" [class.met]="hasSpecialChar()">
            <i class="fas fa-check-circle me-1"></i>Special char
          </span>
        </div>
      </div>

      <div class="mb-5">
        <label class="f-label">Confirm New Password *</label>
        <div style="position:relative;">
          <input [type]="showConfirm ? 'text' : 'password'" class="f-input"
            placeholder="Re-enter password"
            [(ngModel)]="form.confirm_password" name="confirm_password"
            autocomplete="new-password" style="padding-right:44px;"/>
          <button type="button" class="pass-toggle" (click)="showConfirm=!showConfirm">
            <i [class]="showConfirm ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
          </button>
        </div>
        <div *ngIf="form.confirm_password && form.new_password !== form.confirm_password"
          style="color:#dc2626;font-size:12px;margin-top:4px;">
          <i class="fas fa-times-circle me-1"></i>Passwords do not match
        </div>
        <div *ngIf="form.confirm_password && form.new_password === form.confirm_password && form.new_password"
          style="color:#16a34a;font-size:12px;margin-top:4px;">
          <i class="fas fa-check-circle me-1"></i>Passwords match
        </div>
      </div>

      <button class="btn btn-green btn-lg w-100" (click)="onSubmit()" [disabled]="loading">
        <span *ngIf="!loading"><i class="fas fa-lock me-2"></i>Change Password</span>
        <span *ngIf="loading"><span class="spinner-border spinner-border-sm me-2"></span>Changing...</span>
      </button>
    </div>
  </div>
</div>
