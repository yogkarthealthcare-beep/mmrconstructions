<ng-container *ngIf="!isLoading && displayedAds.length > 0">
  <section class="home-ad-section" (mouseenter)="pauseSlider()" (mouseleave)="resumeSlider()">
    <div class="ad-banner-container">
      <div class="ad-slides-wrapper" [style.transform]="'translateX(-' + (currentIndex * 100) + '%)'">
        <div
          class="ad-slide"
          *ngFor="let ad of displayedAds; let i = index"
          (click)="onSlideClick(ad)"
          [title]="ad.title || 'Advertisement'">
          
          <!-- 1. IMAGE AD (Simple, clean, full visibility) -->
          <ng-container *ngIf="ad.type === 'image'">
            <img
              [src]="resolveUrl(ad.url)"
              [alt]="ad.title || 'Advertisement'"
              class="ad-banner-media"
              loading="lazy" />
          </ng-container>

          <!-- 2. YOUTUBE AD -->
          <ng-container *ngIf="ad.type === 'youtube'">
            <iframe
              *ngIf="getYouTubeEmbedUrl(ad) as ytUrl"
              [src]="ytUrl"
              title="YouTube Ad Video"
              class="ad-bg-iframe"
              frameborder="0"
              allow="autoplay; encrypted-media; picture-in-picture"
              allowfullscreen>
            </iframe>
            <img
              *ngIf="!getYouTubeEmbedUrl(ad)"
              [src]="getThumbnail(ad)"
              [alt]="ad.title || 'YouTube Video'"
              class="ad-banner-media" />
          </ng-container>

          <!-- 3. UPLOADED VIDEO AD -->
          <ng-container *ngIf="ad.type === 'video'">
            <video
              [src]="resolveUrl(ad.url)"
              autoplay
              muted
              loop
              playsinline
              preload="metadata"
              class="ad-banner-media">
            </video>
          </ng-container>

          <!-- Optional CTA Badge if click-through link exists -->
          <a
            *ngIf="ad.cta_link"
            [href]="ad.cta_link"
            target="_blank"
            rel="noopener"
            (click)="$event.stopPropagation()"
            class="ad-cta-badge">
            <span>{{ ad.cta_label || 'Explore Now' }}</span>
            <i class="fas fa-arrow-right ms-1"></i>
          </a>
        </div>
      </div>

      <!-- Navigation Arrows (if > 1 ad) -->
      <ng-container *ngIf="displayedAds.length > 1">
        <button
          type="button"
          class="ad-slider-arrow prev"
          (click)="prevSlide(); $event.stopPropagation()"
          aria-label="Previous advertisement slide">
          <i class="fas fa-chevron-left"></i>
        </button>
        <button
          type="button"
          class="ad-slider-arrow next"
          (click)="nextSlide(); $event.stopPropagation()"
          aria-label="Next advertisement slide">
          <i class="fas fa-chevron-right"></i>
        </button>

        <!-- Pagination Indicators / Dots -->
        <div class="ad-dots-container" (click)="$event.stopPropagation()">
          <button
            type="button"
            class="ad-dot"
            *ngFor="let ad of displayedAds; let dotIdx = index"
            [class.active]="dotIdx === currentIndex"
            (click)="goToSlide(dotIdx)"
            [attr.aria-label]="'Go to slide ' + (dotIdx + 1)">
          </button>
        </div>
      </ng-container>
    </div>
  </section>

  <!-- Lightbox Modal for Full View / Video Audio -->
  <app-lightbox-modal
    [isOpen]="showLightbox"
    [item]="activeLightboxAd"
    (closeEvent)="showLightbox = false">
  </app-lightbox-modal>
</ng-container>
