<div class="admin-table-wrapper" [class.table-fullscreen-active-container]="isFullscreen">
  
  <!-- Mobile-Only Table Toolbar -->
  <div class="admin-table-mobile-bar d-flex d-md-none align-items-center justify-content-between flex-wrap gap-2 pb-2 mb-2 border-bottom" *ngIf="showMobileToolbar && !isFullscreen">
    <div class="d-flex align-items-center gap-1.5 min-w-0">
      <span class="fs-12 fw-800 text-dark text-truncate">{{ title }}</span>
      <span class="badge bg-light text-muted border fs-10" *ngIf="count !== null && count !== undefined">{{ count }}</span>
    </div>

    <div class="d-flex align-items-center gap-1.5 ms-auto">
      <button type="button" class="btn btn-outline-secondary btn-xs fw-700 py-1 px-2 d-flex align-items-center gap-1" (click)="toggleFullscreen()" title="Toggle Fullscreen Table View">
        <i class="fas fa-expand fs-10 text-primary"></i>
        <span>Fullscreen</span>
      </button>
      <button type="button" class="btn btn-outline-success btn-xs fw-700 py-1 px-2 d-flex align-items-center gap-1" *ngIf="showExport" (click)="triggerExport()" title="Export Table">
        <i class="fas fa-file-export fs-10 text-success"></i>
        <span>Export</span>
      </button>
    </div>
  </div>

  <!-- Fullscreen Dedicated Header (Rendered only when Fullscreen is Active) -->
  <div class="table-fullscreen-header p-2 mb-2 bg-light border rounded-8" *ngIf="isFullscreen">
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 w-100">
      <div class="d-flex align-items-center gap-2">
        <button type="button" class="btn btn-danger btn-xs py-1 px-2.5 fw-800 d-flex align-items-center gap-1.5 shadow-sm rounded-6" (click)="closeFullscreen()">
          <i class="fas fa-times fs-11"></i>
          <span>Close Fullscreen</span>
        </button>
        <div>
          <h6 class="fs-13 fw-800 text-dark mb-0">{{ title }}</h6>
          <span class="fs-10 text-muted fw-600" *ngIf="count !== null && count !== undefined">{{ count }} Records</span>
        </div>
      </div>

      <div class="d-flex align-items-center gap-2 ms-auto">
        <span class="fs-10 text-muted fw-700 bg-white py-1 px-2 rounded border">
          <i class="fas fa-arrows-alt text-gold me-1"></i> Swipe table to view all columns
        </span>
        <button type="button" class="btn btn-outline-secondary btn-xs py-1 px-2 rounded-6" (click)="closeFullscreen()" title="Exit Fullscreen">
          <i class="fas fa-compress"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Scrollable Table Content Slot -->
  <div class="admin-table-scroll-container" [class.fullscreen-scroll]="isFullscreen">
    <ng-content></ng-content>
  </div>

</div>
