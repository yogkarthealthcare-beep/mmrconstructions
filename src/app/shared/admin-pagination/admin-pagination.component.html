<div class="admin-table-footer">
  
  <!-- Left Side: Info & Page Size -->
  <div class="footer-left">
    <div class="entries-info" *ngIf="totalItems > 0">
      Showing <strong>{{ startItem }}</strong> to <strong>{{ endItem }}</strong> of <strong>{{ totalItems }}</strong> entries
    </div>

    <div class="page-size-wrap">
      <span class="page-size-label">Show</span>
      <select class="page-size-select" [ngModel]="pageSize" (ngModelChange)="onPageSizeSelect($event)">
        <option *ngFor="let opt of pageSizeOptions" [value]="opt">{{ opt }}</option>
      </select>
      <span class="page-size-label">entries</span>
    </div>
  </div>

  <!-- Right Side: Export & Pagination Navigation -->
  <div class="footer-right">
    
    <!-- Compact Export Dropdown -->
    <div class="dropdown position-relative export-dropdown-wrap" *ngIf="showExport">
      <button type="button" class="btn-export" (click)="toggleExportDropdown($event)" title="Export Data">
        <i class="fas fa-file-export text-emerald"></i>
        <span>Export Data</span>
        <i class="fas fa-chevron-down caret-icon"></i>
      </button>

      <div class="dropdown-menu dropdown-menu-end export-menu shadow-sm" [class.show]="exportDropdownOpen">
        <div class="export-menu-header">
          <i class="fas fa-file-excel text-emerald me-1"></i> Excel / CSV
        </div>
        <button type="button" class="export-menu-item" (click)="triggerExport('current-excel')">
          <span><i class="fas fa-file-csv text-emerald me-1.5"></i>Current Page (Excel)</span>
          <span class="item-badge">{{ endItem - startItem + 1 }}</span>
        </button>
        <button type="button" class="export-menu-item" (click)="triggerExport('all-excel')">
          <span><i class="fas fa-table text-success me-1.5"></i>All Data (Excel)</span>
          <span class="item-badge full-badge">{{ totalItems }}</span>
        </button>

        <div class="export-menu-divider"></div>

        <div class="export-menu-header">
          <i class="fas fa-file-pdf text-danger me-1"></i> PDF Reports
        </div>
        <button type="button" class="export-menu-item" (click)="triggerExport('current-pdf')">
          <span><i class="fas fa-file-pdf text-danger me-1.5"></i>Current Page (PDF)</span>
        </button>
        <button type="button" class="export-menu-item" (click)="triggerExport('all-pdf')">
          <span><i class="fas fa-print text-danger me-1.5"></i>All Data (PDF Report)</span>
        </button>
      </div>
    </div>

    <!-- Compact Pagination Controls -->
    <nav *ngIf="totalPages > 1" class="pagination-nav" aria-label="Table pagination">
      <ul class="pagination-list">
        <li class="page-item" [class.disabled]="currentPage === 1">
          <button type="button" class="page-btn prev-btn" (click)="onPrev()" [disabled]="currentPage === 1" aria-label="Previous">
            <i class="fas fa-chevron-left"></i>
            <span class="d-none d-sm-inline ms-1">Previous</span>
          </button>
        </li>

        <ng-container *ngFor="let p of pageNumbers">
          <li class="page-item" *ngIf="p !== '...'" [class.active]="p === currentPage">
            <button type="button" class="page-btn num-btn" (click)="onPageClick(p)">{{ p }}</button>
          </li>
          <li class="page-item disabled" *ngIf="p === '...'">
            <span class="page-ellipsis">&hellip;</span>
          </li>
        </ng-container>

        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <button type="button" class="page-btn next-btn" (click)="onNext()" [disabled]="currentPage === totalPages" aria-label="Next">
            <span class="d-none d-sm-inline me-1">Next</span>
            <i class="fas fa-chevron-right"></i>
          </button>
        </li>
      </ul>
    </nav>
  </div>

</div>
