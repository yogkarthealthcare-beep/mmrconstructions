<div class="pg-header mb-4">
  <div>
    <h4 class="pg-title">Admin Security Settings</h4>
    <p class="pg-sub">Change Admin Panel Password</p>
  </div>
</div>

<div class="row justify-content-center">
  <div class="col-lg-6 col-md-8 col-sm-12">
    <div class="panel-card shadow-sm p-4 rounded-3">

      <!-- Success Alert -->
      <div *ngIf="success" class="alert alert-success d-flex align-items-center mb-4" role="alert">
        <i class="fas fa-check-circle me-2 fs-5"></i>
        <div>
          <strong>{{ success }}</strong> Redirecting to login page...
        </div>
      </div>

      <!-- Error Alert -->
      <div *ngIf="error" class="alert alert-danger d-flex align-items-center mb-4" role="alert">
        <i class="fas fa-exclamation-triangle me-2 fs-5"></i>
        <div>{{ error }}</div>
      </div>

      <form (ngSubmit)="onSubmit()">
        <!-- Read-only Username / Admin User -->
        <div class="mb-3">
          <label class="form-label fw-semibold text-secondary">Username / Admin User</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="fas fa-user-shield text-muted"></i></span>
            <input type="text" class="form-control bg-light text-muted fw-semibold" [value]="adminEmail" readonly disabled />
          </div>
        </div>

        <hr class="my-4 text-muted" />

        <!-- Current Password -->
        <div class="mb-3">
          <label class="form-label fw-semibold">Current Password <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="fas fa-lock text-muted"></i></span>
            <input [type]="showCurrent ? 'text' : 'password'" class="form-control"
                   placeholder="Enter current password"
                   [(ngModel)]="form.current_password" name="current_password" required />
            <button type="button" class="btn btn-outline-secondary" (click)="showCurrent = !showCurrent">
              <i [class]="showCurrent ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
            </button>
          </div>
        </div>

        <!-- New Password -->
        <div class="mb-3">
          <label class="form-label fw-semibold">New Password <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="fas fa-key text-muted"></i></span>
            <input [type]="showNew ? 'text' : 'password'" class="form-control"
                   placeholder="Enter new password (min. 6 characters)"
                   [(ngModel)]="form.new_password" name="new_password" required />
            <button type="button" class="btn btn-outline-secondary" (click)="showNew = !showNew">
              <i [class]="showNew ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
            </button>
          </div>
        </div>

        <!-- Confirm New Password -->
        <div class="mb-4">
          <label class="form-label fw-semibold">Confirm New Password <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="fas fa-check-double text-muted"></i></span>
            <input [type]="showConfirm ? 'text' : 'password'" class="form-control"
                   placeholder="Re-enter new password"
                   [(ngModel)]="form.confirm_password" name="confirm_password" required />
            <button type="button" class="btn btn-outline-secondary" (click)="showConfirm = !showConfirm">
              <i [class]="showConfirm ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
            </button>
          </div>
          <div *ngIf="form.confirm_password && form.new_password !== form.confirm_password" class="text-danger small mt-1">
            <i class="fas fa-times-circle me-1"></i>New password and confirm password do not match.
          </div>
          <div *ngIf="form.confirm_password && form.new_password === form.confirm_password && form.new_password" class="text-success small mt-1">
            <i class="fas fa-check-circle me-1"></i>Passwords match.
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-success w-100 py-2 fw-bold text-uppercase shadow-sm" [disabled]="loading">
          <span *ngIf="!loading"><i class="fas fa-save me-2"></i>Change Password</span>
          <span *ngIf="loading"><span class="spinner-border spinner-border-sm me-2"></span>Updating...</span>
        </button>
      </form>
    </div>
  </div>
</div>
