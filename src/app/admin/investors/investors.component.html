<div class="pg-header investor-head"><div><h4>Investor Management</h4><p>Manage profiles displayed in Our Investors.</p></div><button class="btn btn-green" (click)="open()"><i class="fas fa-plus me-2"></i>Add Investor</button></div><div class="alert alert-success" *ngIf="message">{{message}}</div><div class="alert alert-danger" *ngIf="error&&!showForm">{{error}}</div><div class="panel-card"><div class="loading" *ngIf="loading"><i class="fas fa-spinner fa-spin"></i></div><div class="empty" *ngIf="!loading&&!rows.length">No investors added yet.</div><div class="table-responsive" *ngIf="rows.length"><table><thead><tr><th>Profile</th><th>Name</th><th>Order</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr *ngFor="let row of rows"><td><img [src]="row.profile_image_url" [alt]="row.name"></td><td><strong>{{row.name}}</strong></td><td>{{row.display_order}}</td><td><span [class.active]="row.is_active" class="status">{{row.is_active?'Active':'Inactive'}}</span></td><td><button class="icon-btn" (click)="open(row)" title="Edit"><i class="fas fa-edit"></i></button><button class="icon-btn" (click)="toggle(row)" [title]="row.is_active?'Deactivate':'Activate'"><i [class]="row.is_active?'fas fa-toggle-on':'fas fa-toggle-off'"></i></button><button class="icon-btn danger" (click)="remove(row)" title="Delete"><i class="fas fa-trash"></i></button></td></tr></tbody></table></div></div>
<div class="modal-bg" *ngIf="showForm" (click)="showForm=false"><form class="investor-modal" (click)="$event.stopPropagation()" (ngSubmit)="save()"><h5>{{editing?'Edit':'Add'}} Investor</h5><div class="preview"><img *ngIf="preview" [src]="preview"><i *ngIf="!preview" class="fas fa-user"></i></div><label>Investor Name *</label><input class="form-control" name="name" [(ngModel)]="form.name"><label>Profile Image {{editing?'':'*'}}</label><input class="form-control" type="file" accept="image/jpeg,image/png,image/webp" (change)="choose($event)"><label>Display Order</label><input class="form-control" type="number" name="order" [(ngModel)]="form.display_order"><label class="check"><input type="checkbox" name="active" [(ngModel)]="form.is_active"> Active</label><div class="alert alert-danger" *ngIf="error">{{error}}</div><div class="actions"><button type="button" class="btn btn-light" (click)="showForm=false">Cancel</button><button class="btn btn-green" [disabled]="saving">{{saving?'Saving...':'Save Investor'}}</button></div></form></div>
