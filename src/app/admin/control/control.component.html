<div class="p-3 p-md-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0" style="color:var(--clr-primary-dk); font-weight:700;">Control</h1>
  </div>

  <div *ngIf="message" class="alert alert-success alert-dismissible fade show" role="alert">
    <i class="fas fa-check-circle me-2"></i> {{ message }}
    <button type="button" class="btn-close" (click)="message = ''"></button>
  </div>
  
  <div *ngIf="error" class="alert alert-danger alert-dismissible fade show" role="alert">
    <i class="fas fa-exclamation-triangle me-2"></i> {{ error }}
    <button type="button" class="btn-close" (click)="error = ''"></button>
  </div>

  <div class="card shadow-sm border-0" style="border-radius:12px; overflow:hidden;">
    <div class="card-header bg-white py-3 border-bottom" style="border-color: #edf2f7 !important;">
      <h5 class="mb-0 text-muted" style="font-weight: 600;">Authentication Settings</h5>
    </div>
    
    <div class="card-body p-0">
      <div *ngIf="loading" class="text-center p-5">
        <div class="spinner-border text-primary" role="status"></div>
        <div class="mt-2 text-muted">Loading settings...</div>
      </div>

      <div class="table-responsive" *ngIf="!loading">
        <table class="table table-hover align-middle mb-0">
          <thead style="background: #f8fafc;">
            <tr>
              <th class="py-3 px-4 border-bottom-0 text-uppercase text-secondary text-xs font-weight-bolder opacity-7">Setting</th>
              <th class="py-3 px-4 border-bottom-0 text-uppercase text-secondary text-xs font-weight-bolder opacity-7">Status</th>
              <th class="py-3 px-4 border-bottom-0 text-uppercase text-secondary text-xs font-weight-bolder opacity-7 text-end">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="py-3 px-4">
                <div class="d-flex align-items-center">
                  <div class="icon-box bg-light-primary text-primary rounded-circle p-2 me-3" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: #e0f2fe; color: #0284c7;">
                    <i class="fas fa-envelope"></i>
                  </div>
                  <div>
                    <h6 class="mb-0 text-sm fw-bold">Email OTP Verification</h6>
                    <p class="text-xs text-secondary mb-0">Require OTP for Signup & Login</p>
                  </div>
                </div>
              </td>
              <td class="py-3 px-4">
                <span class="badge" [ngClass]="settings.email_otp_enabled ? 'bg-success' : 'bg-secondary'" style="padding: 6px 12px; border-radius: 6px;">
                  {{ settings.email_otp_enabled ? 'Enabled' : 'Disabled' }}
                </span>
              </td>
              <td class="py-3 px-4 text-end">
                <div class="form-check form-switch d-inline-block m-0" style="font-size: 1.25rem;">
                  <input class="form-check-input" type="checkbox" role="switch" style="cursor: pointer;"
                    [checked]="settings.email_otp_enabled"
                    (change)="toggleEmailOtp()"
                    [disabled]="saving">
                </div>
              </td>
            </tr>
            
            <tr>
              <td class="py-3 px-4">
                <div class="d-flex align-items-center">
                  <div class="icon-box rounded-circle p-2 me-3" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: #dcfce7; color: #16a34a;">
                    <i class="fab fa-whatsapp"></i>
                  </div>
                  <div>
                    <h6 class="mb-0 text-sm fw-bold">WhatsApp OTP Verification</h6>
                    <p class="text-xs text-secondary mb-0">Coming Soon / Future</p>
                  </div>
                </div>
              </td>
              <td class="py-3 px-4">
                <span class="badge bg-secondary" style="padding: 6px 12px; border-radius: 6px;">
                  Coming Soon
                </span>
              </td>
              <td class="py-3 px-4 text-end">
                <div class="form-check form-switch d-inline-block m-0" style="font-size: 1.25rem;">
                  <input class="form-check-input" type="checkbox" role="switch" disabled>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
