<div class="pg-header"><h4>Home Page Settings</h4><p>Control the information strip on the public Home Page.</p></div>
<div class="settings-card">
  <h5>Information Strip</h5>
  <label class="switch-row"><input type="checkbox" [(ngModel)]="settings.show_information_section"><span>Show information section</span><small>Government Registered, Bank Finance, Buyback, Android App and PDF Vouchers</small></label>
  <button class="btn btn-green" (click)="save()" [disabled]="saving"><i class="fas fa-save me-2"></i>{{saving?'Saving...':'Save Settings'}}</button>
  <span class="save-message">{{message}}</span>
</div>
