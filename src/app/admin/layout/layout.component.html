<div class="panel-shell">
  <div class="sidebar-overlay" *ngIf="sidebarOpen" (click)="sidebarOpen=false"></div>

  <aside class="sidebar" [class.open]="sidebarOpen" [class.collapsed]="sidebarCollapsed">
    <!-- Admin info card -->
    <div class="sidebar-user-card">
      <div class="d-flex align-items-center gap-3">
        <div class="sidebar-avatar">{{ initials }}</div>
        <div>
          <div class="sidebar-user-name">{{ adminUser?.full_name || 'MMR Admin' }}</div>
          <div class="sidebar-user-id">{{ adminUser?.role || 'SuperAdmin' }}</div>
        </div>
      </div>
    </div>

    <!-- Accordion Nav Groups -->
    <nav class="sidebar-nav">
      <div *ngFor="let group of filteredNavGroups" class="nav-group-wrapper">
        <div class="nav-group-header" (click)="toggleGroup(group)">
          <span class="nav-group-title">
            <i [class]="group.icon + ' me-1.5'"></i><span class="ng-text">{{ group.label }}</span>
          </span>
          <i class="fas" [class.fa-chevron-down]="group.expanded" [class.fa-chevron-right]="!group.expanded"></i>
        </div>

        <div class="nav-group-children" *ngIf="group.expanded">
          <a *ngFor="let item of group.items"
             [routerLink]="item.route"
             routerLinkActive="active"
             class="sidebar-link sub-link"
             (click)="sidebarOpen=false">
            <i [class]="item.icon"></i>
            <span class="sl-label">{{ item.label }}</span>
            <span *ngIf="item.badge" class="sl-badge" [class.red]="item.red">{{ item.badge }}</span>
          </a>
        </div>
      </div>
    </nav>

    <div class="sidebar-footer">
      <a routerLink="/" class="sidebar-link">
        <i class="fas fa-globe"></i><span class="sl-label">View Website</span>
      </a>
      <a class="sidebar-link" style="cursor:pointer;" (click)="logout()">
        <i class="fas fa-sign-out-alt"></i><span class="sl-label">Logout</span>
      </a>
    </div>
  </aside>

  <div class="panel-main">
    <header class="panel-topbar">
      <button class="hamburger-toggle" (click)="sidebarOpen=true">
        <i class="fas fa-bars"></i>
      </button>
      <button class="desktop-toggle" (click)="toggleDesktopSidebar()">
        <i class="fas fa-bars"></i>
      </button>
      <div class="flex-fill" style="min-width:0;">
        <div class="topbar-page-title">Admin Management Console</div>
      </div>
      <div class="topbar-actions">
        <div class="topbar-icon-btn" title="Notifications">
          <i class="fas fa-bell"></i>
          <span class="notif-dot"></span>
        </div>
        <div class="topbar-icon-btn" title="Settings">
          <i class="fas fa-cog"></i>
        </div>
        <div class="topbar-avatar" [title]="adminUser?.full_name || 'Admin'">{{ initials }}</div>
      </div>
    </header>

    <main class="panel-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
