<div class="data-table-wrap">
  <div class="data-table-head">
    <h5>
      <i class="fas fa-list-check"></i> Available Payment Gateways
    </h5>
    <div class="badge-status-info">
      <i class="fas fa-info-circle"></i> Active default gateway processes direct transactions.
    </div>
  </div>

  <div class="table-responsive">
    <table class="table-custom">
      <thead>
        <tr>
          <th>Gateway / Brand</th>
          <th>Environment</th>
          <th>Priority</th>
          <th>Default</th>
          <th>Status</th>
          <th class="text-end">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let gw of gateways">
          <!-- Logo & Brand Name -->
          <td>
            <div class="d-flex align-items-center gap-3">
              <div class="table-logo-box">
                <img [src]="getLogoUrl(gw)" [alt]="gw.display_name" class="table-logo-img" />
              </div>
              <div>
                <div class="gw-list-title">{{ gw.display_name }}</div>
                <div class="gw-list-code">{{ gw.gateway_name }}</div>
              </div>
            </div>
          </td>

          <!-- Environment Pill -->
          <td>
            <span class="env-pill" [ngClass]="(gw.mode === 'production' || gw.mode === 'live' || gw.environment_mode === 'production' || gw.environment_mode === 'live') ? 'env-live' : 'env-sandbox'">
              {{ (gw.environment_mode || gw.mode || 'sandbox') | uppercase }}
            </span>
          </td>

          <!-- Priority Input -->
          <td>
            <input
              type="number"
              class="priority-input-custom"
              [value]="gw.priority || 0"
              (change)="onPriorityChange(gw, $event)"
              min="0"
              max="99"
            />
          </td>

          <!-- Default Selection Button -->
          <td>
            <button
              type="button"
              class="default-toggle-btn-modern"
              [class.is-default]="defaultGateway === gw.gateway_name"
              [disabled]="gw.status !== 'active'"
              (click)="onSetDefault(gw)"
              [title]="gw.status !== 'active' ? 'Gateway must be active to be set as default' : 'Set as default'"
            >
              <i class="fas" [ngClass]="defaultGateway === gw.gateway_name ? 'fa-check-circle' : 'fa-circle'"></i>
              <span>{{ defaultGateway === gw.gateway_name ? 'Default' : 'Set Default' }}</span>
            </button>
          </td>

          <!-- Status Badge -->
          <td>
            <app-status-badge [status]="gw.status"></app-status-badge>
          </td>

          <!-- Actions -->
          <td class="text-end">
            <div class="d-flex justify-content-end gap-2">
              <button
                type="button"
                class="action-btn-custom"
                [class.btn-power-active]="gw.status === 'active'"
                (click)="onToggleStatus(gw)"
                [title]="gw.status === 'active' ? 'Shift to maintenance mode' : 'Activate gateway'"
              >
                <i class="fas" [ngClass]="gw.status === 'active' ? 'fa-power-off' : 'fa-play'"></i>
              </button>
            </div>
          </td>
        </tr>

        <!-- Empty state -->
        <tr *ngIf="gateways.length === 0">
          <td colspan="6" class="text-center py-5">
            <div class="text-muted">
              <i class="fas fa-credit-card fs-2 mb-2 d-block"></i>
              <h6>No gateways registered</h6>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
