<div class="d-flex align-items-start justify-content-between mb-4 flex-wrap gap-3">
  <div class="pg-header" style="margin-bottom:0;"><h4>Enquiries Management</h4><p>All website enquiries from potential customers</p></div>
  <button class="btn btn-green btn-sm"><i class="fas fa-download me-1"></i>Export CSV</button>
</div>

<div class="d-flex align-items-center gap-3 mb-4 flex-wrap">
  <div class="filter-tabs">
    <div class="filter-tab" [class.active]="filter==='all'"    (click)="filter='all'">All ({{ enquiries.length }})</div>
    <div class="filter-tab" [class.active]="filter==='open'"   (click)="filter='open'">Open</div>
    <div class="filter-tab" [class.active]="filter==='called'" (click)="filter='called'">Called</div>
    <div class="filter-tab" [class.active]="filter==='closed'" (click)="filter='closed'">Closed</div>
  </div>
  <div class="search-box ms-auto"><i class="fas fa-search"></i><input [(ngModel)]="search" placeholder="Search..."/></div>
</div>

<div class="data-table-wrap">
  <div class="table-responsive">
    <table class="table">
      <thead><tr><th>Name & Mobile</th><th>Interest</th><th>Message</th><th>Priority</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>
        <tr *ngFor="let e of filtered">
          <td><strong style="color:var(--txt-h);">{{ e.name }}</strong><div class="fs-12 text-muted">{{ e.mobile }}</div></td>
          <td class="fs-12" style="max-width:140px;">{{ e.interest }}</td>
          <td class="fs-12 text-muted" style="max-width:180px;">{{ e.message }}</td>
          <td><span class="sbadge" [class.sbadge-red]="e.priority==='high'" [class.sbadge-yellow]="e.priority==='medium'" [class.sbadge-gray]="e.priority==='low'">{{ e.priority }}</span></td>
          <td class="fs-12 text-muted">{{ e.date | date:'dd MMM' }}</td>
          <td><span class="sbadge" [class.sbadge-blue]="e.status==='open'" [class.sbadge-yellow]="e.status==='called'" [class.sbadge-gray]="e.status==='closed'">{{ e.status }}</span></td>
          <td>
            <div class="d-flex gap-1">
              <a [href]="'tel:'+e.mobile" class="action-btn" title="Call"><i class="fas fa-phone"></i></a>
              <a [href]="'https://wa.me/91'+e.mobile" target="_blank" class="action-btn" style="color:#16a34a;" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>
              <button class="action-btn" title="Mark Called" (click)="updateStatus(e,'called')"><i class="fas fa-phone-volume"></i></button>
              <button class="action-btn danger" title="Close" (click)="updateStatus(e,'closed')"><i class="fas fa-times"></i></button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
