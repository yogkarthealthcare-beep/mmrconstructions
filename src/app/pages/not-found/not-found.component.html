<app-topbar></app-topbar>
<app-navbar></app-navbar>

<div class="nf-container">
  <div class="nf-card">
    <!-- Decorative Graphic Badge -->
    <div class="nf-badge-wrap">
      <div class="nf-circle-glow"></div>
      <div class="nf-icon-box">
        <i class="fas fa-compass nf-animated-icon"></i>
      </div>
    </div>

    <!-- 404 Large Gradient Number -->
    <h1 class="nf-glitch-title">404</h1>

    <!-- Heading & Message -->
    <h2 class="nf-heading">Page Not Found</h2>
    <p class="nf-subheading-hi">पृष्ठ नहीं मिला</p>
    <p class="nf-description">
      The link you clicked might be broken or the page may have been removed.
      Don't worry, we're taking you back to safety.
    </p>

    <!-- Live Countdown Banner -->
    <div class="nf-countdown-box">
      <i class="fas fa-clock-rotate-left me-2"></i>
      <span>Redirecting to Home in <strong class="nf-timer-val">{{ countdown }}</strong> seconds...</span>
    </div>

    <!-- Action Buttons -->
    <div class="nf-action-buttons">
      <button type="button" class="nf-btn nf-btn-back" (click)="goBack()">
        <i class="fas fa-arrow-left me-2"></i> Go Back (पिछला पेज)
      </button>

      <button type="button" class="nf-btn nf-btn-home" (click)="goHome()">
        <i class="fas fa-house me-2"></i> Go to Home (होम पेज)
      </button>
    </div>
  </div>
</div>

<app-footer></app-footer>
