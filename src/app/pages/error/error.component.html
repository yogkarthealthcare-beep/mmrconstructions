<app-topbar></app-topbar>
<app-navbar></app-navbar>

<div class="err-container">
  <div class="err-card">
    <!-- Decorative Graphic Badge -->
    <div class="err-badge-wrap">
      <div class="err-circle-glow"></div>
      <div class="err-icon-box">
        <i class="fas fa-triangle-exclamation err-animated-icon"></i>
      </div>
    </div>

    <!-- Error Code / Title -->
    <div class="err-code-tag">ERROR {{ errorCode }}</div>
    <h2 class="err-heading">Something Went Wrong</h2>
    <p class="err-subheading-hi">कुछ तकनीकी समस्या आ गई है</p>

    <!-- Error Description / Issue -->
    <div class="err-msg-banner">
      <i class="fas fa-circle-info me-2 text-warning"></i>
      <span>{{ errorMessage }}</span>
    </div>

    <!-- Live Countdown Banner -->
    <div class="err-countdown-box">
      <i class="fas fa-clock-rotate-left me-2"></i>
      <span>Redirecting to Home in <strong class="err-timer-val">{{ countdown }}</strong> seconds...</span>
    </div>

    <!-- Action Buttons -->
    <div class="err-action-buttons">
      <button type="button" class="err-btn err-btn-back" (click)="goBack()">
        <i class="fas fa-arrow-left me-2"></i> Go Back (पिछला पेज)
      </button>

      <button type="button" class="err-btn err-btn-retry" (click)="retry()">
        <i class="fas fa-rotate-right me-2"></i> Try Again (पुनः प्रयास करें)
      </button>

      <button type="button" class="err-btn err-btn-home" (click)="goHome()">
        <i class="fas fa-house me-2"></i> Go to Home (होम पेज)
      </button>
    </div>
  </div>
</div>

<app-footer></app-footer>
