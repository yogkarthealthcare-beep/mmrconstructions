<div class="login-page">
  <div class="login-left">
    <a routerLink="/" class="brand mb-5 d-inline-flex text-decoration-none">
      <div class="brand-icon me-3"><span>M</span></div>
      <div>
        <span class="brand-name" style="color:#fff;">M.M.R. Constructions</span>
        <span class="brand-sub">& Developers Pvt. Ltd.</span>
      </div>
    </a>
    <div>
      <div style="color:var(--clr-gold-lt);font-family:var(--ff-ui);letter-spacing:.2em;font-size:.75rem;text-transform:uppercase;margin-bottom:10px;">Secure Reset</div>
      <h2 style="font-family:var(--ff-display);color:#fff;font-size:2.4rem;line-height:1.15;margin-bottom:16px;">Recover Your<br/>Account Access</h2>
      <p style="color:rgba(255,255,255,.55);line-height:1.8;max-width:320px;font-size:13.5px;">A 6-digit OTP will be sent to your registered email address.</p>
    </div>
  </div>

  <div class="login-right">
    <div class="login-box">
      <div class="mb-4">
        <h3 style="font-family:var(--ff-display);color:var(--txt-h);margin-bottom:6px;">Forgot Password</h3>
        <p class="fs-13 text-muted">Verify your email OTP, then set a new password.</p>
      </div>

      <div *ngIf="error" class="panel-alert panel-alert-error mb-4"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
      <div *ngIf="success" class="panel-alert panel-alert-success mb-4"><i class="fas fa-check-circle"></i> {{ success }}</div>

      <form *ngIf="step === 'email'" (ngSubmit)="sendOtp()">
        <div class="mb-4">
          <label class="f-label">Registered Email *</label>
          <div style="position:relative;">
            <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--txt-muted);"><i class="fas fa-envelope"></i></span>
            <input type="email" class="f-input" style="padding-left:38px;" placeholder="you@example.com" [(ngModel)]="email" name="email" autocomplete="email" required/>
          </div>
        </div>
        <button type="submit" class="btn btn-green btn-lg w-100 mb-3" [disabled]="loading">
          <i [class]="loading ? 'fas fa-spinner fa-spin me-2' : 'fas fa-paper-plane me-2'"></i>
          {{ loading ? 'Sending OTP...' : 'Send OTP' }}
        </button>
      </form>

      <form *ngIf="step === 'reset'" (ngSubmit)="resetPassword()">
        <div class="mb-3">
          <label class="f-label">OTP sent to</label>
          <input type="email" class="f-input" [value]="email" disabled style="background:var(--bg-section);"/>
        </div>

        <div class="mb-3">
          <label class="f-label">Email OTP *</label>
          <div class="otp-inputs mb-2" (paste)="onOtpPaste($event)">
            <input *ngFor="let o of otp; let i=index" [id]="'resetOtp'+i" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" [value]="o" [name]="'resetOtp'+i" (input)="onOtpInput($event,i)" (keydown)="onOtpKeydown($event,i)" aria-label="OTP digit"/>
          </div>
        </div>

        <div class="mb-3">
          <label class="f-label">New Password *</label>
          <div style="position:relative;">
            <input [type]="showNew ? 'text' : 'password'" class="f-input" style="padding-right:44px;" placeholder="Minimum 8 characters" [(ngModel)]="newPassword" name="newPassword" autocomplete="new-password"/>
            <button type="button" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--txt-muted);" (click)="showNew=!showNew">
              <i [class]="showNew ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
            </button>
          </div>
        </div>

        <div class="mb-4">
          <label class="f-label">Confirm Password *</label>
          <div style="position:relative;">
            <input [type]="showConfirm ? 'text' : 'password'" class="f-input" style="padding-right:44px;" placeholder="Re-enter password" [(ngModel)]="confirmPassword" name="confirmPassword" autocomplete="new-password"/>
            <button type="button" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--txt-muted);" (click)="showConfirm=!showConfirm">
              <i [class]="showConfirm ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-green btn-lg w-100 mb-3" [disabled]="loading">
          <i [class]="loading ? 'fas fa-spinner fa-spin me-2' : 'fas fa-lock me-2'"></i>
          {{ loading ? 'Resetting...' : 'Reset Password' }}
        </button>
        <button type="button" class="btn btn-outline-green w-100" (click)="sendOtp()" [disabled]="loading">Resend OTP</button>
      </form>

      <div *ngIf="step === 'done'" class="text-center">
        <button type="button" class="btn btn-green btn-lg w-100 mb-3" (click)="goLogin()">
          <i class="fas fa-sign-in-alt me-2"></i>Login Now
        </button>
      </div>

      <div class="text-center mt-3">
        <a routerLink="/login" class="fs-12 fw-700" style="color:var(--clr-primary);">Back to login</a>
      </div>
    </div>
  </div>
</div>
