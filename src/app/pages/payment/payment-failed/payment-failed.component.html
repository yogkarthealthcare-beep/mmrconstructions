<div class="status-page-wrapper">
  <div class="panel-card status-card failed-card text-center">
    <!-- Icon animation container -->
    <div class="failed-icon-wrap mb-4">
      <div class="circle-bg"></div>
      <i class="fas fa-times-circle failed-icon"></i>
    </div>

    <!-- Title and message -->
    <h3 class="status-title text-danger">Payment Failed</h3>
    <p class="status-desc">
      We were unable to process your payment. This could be due to incorrect details, insufficient balance, or network issues at your bank.
    </p>

    <!-- Details Box -->
    <div class="details-box-accent my-4">
      <div class="db-row">
        <span>Order ID</span>
        <strong>{{ orderId }}</strong>
      </div>
      <div class="db-row">
        <span>Reason</span>
        <span class="text-danger fw-600">{{ reason }}</span>
      </div>
    </div>

    <!-- Action buttons -->
    <div class="status-actions d-flex flex-column gap-2 mt-4">
      <a [routerLink]="['/payment', orderId]" class="btn btn-green w-100" *ngIf="orderId && orderId !== '—'">
        <i class="fas fa-redo"></i> Retry Payment
      </a>
      <a routerLink="/user/dashboard" class="btn btn-outline-green w-100">
        <i class="fas fa-th-large"></i> Go to Dashboard
      </a>
    </div>
  </div>
</div>
