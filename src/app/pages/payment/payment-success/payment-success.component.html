<div class="status-page-wrapper">
  <div class="panel-card status-card success-card text-center">
    <!-- Icon animation container -->
    <div class="success-icon-wrap mb-4">
      <div class="circle-bg"></div>
      <i class="fas fa-check-circle success-icon"></i>
    </div>

    <!-- Title and message -->
    <h3 class="status-title">Payment Successful!</h3>
    <p class="status-desc">
      Thank you! Your payment session completed successfully. Your booking status is being updated, and a confirmation receipt has been sent to your email.
    </p>

    <!-- Details Box -->
    <div class="details-box-accent my-4">
      <div class="db-row">
        <span>Order ID</span>
        <strong>{{ orderId }}</strong>
      </div>
      <div class="db-row">
        <span>Status</span>
        <span class="badge-success-label"><i class="fas fa-shield-alt"></i> Verified</span>
      </div>
    </div>

    <!-- Action buttons -->
    <div class="status-actions d-flex flex-column gap-2 mt-4">
      <a routerLink="/user/dashboard" class="btn btn-green w-100">
        <i class="fas fa-th-large"></i> Go to Dashboard
      </a>
      <a routerLink="/user/payments" class="btn btn-outline-green w-100">
        <i class="fas fa-history"></i> View Payment History
      </a>
    </div>
  </div>
</div>
